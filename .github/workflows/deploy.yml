name: CI/CD — Deploy to EC2 (Docker Compose)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  EC2_SSH_PORT: 22
  APP_DIR: /home/ubuntu/myapp
  REPO_BRANCH: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then echo "Missing secret: EC2_HOST" && exit 1; fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then echo "Missing secret: EC2_USER" && exit 1; fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then echo "Missing secret: EC2_SSH_KEY" && exit 1; fi

      - name: Write SSH private key and add known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT || env.EC2_SSH_PORT }}
        run: |
          set -euo pipefail
          KEY_PATH=/tmp/gha_deploy_key
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # add host key (best-effort)
          ssh-keyscan -p "${EC2_SSH_PORT}" -H "${EC2_HOST}" >> ~/.ssh/known_hosts || true
          echo "Wrote key to $KEY_PATH and updated known_hosts"
        # keep the private key for use by appleboy step

      - name: Test SSH connectivity (quick)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT || env.EC2_SSH_PORT }}
        run: |
          set -euo pipefail
          KEY_PATH=/tmp/gha_deploy_key
          if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$KEY_PATH" -p "${EC2_SSH_PORT}" "${EC2_USER}@${EC2_HOST}" 'echo ACTION_RUNNER:CONNECTED'; then
            echo "SSH test OK"
          else
            echo "SSH test FAILED - check secrets and security group"
            # produce verbose attempt to help debugging (will show in logs)
            ssh -vvv -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$KEY_PATH" -p "${EC2_SSH_PORT}" "${EC2_USER}@${EC2_HOST}" 'echo DEBUG' || true
            exit 1
          fi

      - name: Remote deploy via SSH action
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          port: ${{ secrets.EC2_SSH_PORT || env.EC2_SSH_PORT }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.APP_DIR || env.APP_DIR }}"
            BRANCH="${{ secrets.REPO_BRANCH || env.REPO_BRANCH }}"
            REPO_SSH="git@github.com:${GITHUB_REPOSITORY}.git"
            REPO_HTTPS="https://github.com/${GITHUB_REPOSITORY}.git"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR" || exit 1
            chown "$(whoami):$(whoami)" "$APP_DIR" || true

            if [ ! -d .git ]; then
              echo "No .git — trying SSH clone (works with repo Deploy Key)"
              if git clone --branch "$BRANCH" "$REPO_SSH" . 2>/tmp/git_clone_ssh.err; then
                echo "Cloned via SSH"
              else
                echo "SSH clone failed; showing reason:"
                sed -n '1,200p' /tmp/git_clone_ssh.err || true
                echo "Falling back to HTTPS clone"
                rm -rf ./* || true
                git clone --branch "$BRANCH" "$REPO_HTTPS" .
              fi
            else
              echo "Repository exists — fetching"
              git fetch --all --prune || true
            fi

            git checkout "$BRANCH" || git checkout -b "$BRANCH"
            git reset --hard "origin/$BRANCH" || true
            git pull origin "$BRANCH" || true

            if [ -f .gitmodules ]; then
              git submodule sync --recursive
              git submodule update --init --recursive
            fi

            if command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              DC="docker compose"
            fi

            docker image prune -af || true
            $DC pull || true
            $DC up -d --build

            echo "Deployed — showing running services:"
            $DC ps --services --filter "status=running" || true

            # optional: server-side healthcheck if HEALTHCHECK_URL env is set on server
            if [ -n "${HEALTHCHECK_URL:-}" ]; then
              echo "Running healthcheck: ${HEALTHCHECK_URL}"
              TRY=0
              until curl -sf "${HEALTHCHECK_URL}" >/dev/null 2>&1 || [ "$TRY" -ge 6 ]; do
                TRY=$((TRY+1))
                echo "Healthcheck try #$TRY failed; sleeping 5s"
                sleep 5
              done
              if curl -sf "${HEALTHCHECK_URL}" >/dev/null 2>&1; then
                echo "Healthcheck OK"
              else
                echo "Healthcheck FAILED"
              fi
            fi

      - name: Cleanup temp key on runner
        if: always()
        run: |
          rm -f /tmp/gha_deploy_key || true
          echo "Temp key removed"
