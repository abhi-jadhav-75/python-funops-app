# Define an 'upstream' server block for our Flask app
# 'web' is the service name we will define in docker-compose.yml
# '5000' is the port Gunicorn is running on inside its container
upstream flask_app {
    server web:5000;
}

server {
    # Nginx will listen on port 80 (the default HTTP port)
    listen 80;
    server_name localhost;

    # Location 1: Serve static files directly
    # This is much faster than routing through Flask
    location /static {
        # This path matches the volume we will set up in docker-compose.yml
        alias /var/www/static;
        expires 30d; # Cache static files for 30 days
    }

    # Location 2: Handle all other requests
    # Pass them to our 'flask_app' upstream server
    location / {
        proxy_pass http://flask_app;
        
        # These headers are important for passing client info to Flask
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
