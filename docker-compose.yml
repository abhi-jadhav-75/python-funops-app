version: '3.8'

services:
  # Service 1: The Flask/Gunicorn Application
  web:
    build: .  # Build the image from the Dockerfile in this directory
    expose:
      - 5000  # Expose port 5000 to the internal Docker network (Nginx will use this)
    volumes:
      # Mount the 'data' directory from the host to the container
      # This makes your subscribers.txt file persistent
      - ./data:/app/data

  # Service 2: The Nginx Reverse Proxy
  nginx:
    image: nginx:alpine # Use the official lightweight Nginx image
    ports:
      # Map port 80 on your host machine to port 80 in the container
      # This is the public-facing port.
      - "80:80"
    volumes:
      # Mount our custom Nginx config
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      # Mount the 'static' directory to be served by Nginx
      - ./static:/var/www/static
    depends_on:
      - web # Tell Nginx to wait for the 'web' service to start

volumes:
  data: # Defines the data volume (though we used a bind mount for simplicity)
